databases:
  - name: teyvat-wechat-db
    plan: free
    databaseName: teyvat_wechat
    user: teyvat_wechat

services:
  - type: web
    name: teyvat-wechat
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: teyvat-wechat-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
